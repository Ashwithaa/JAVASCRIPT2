<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
</head>
<body>
    <h1>Unit Converter</h1>
    <br/>
    <input type="number" id="input1" />
    <button id="submit1" >Submit</button>
    <p id="result1"></p>
    <p id="result2"></p>
</body>
<script>
    const inp1  = document.getElementById("input1");
    const smt1  = document.getElementById("submit1");
    const rslt1 = document.getElementById("result1");
    const rslt2 = document.getElementById("result2");
    
    smt1.onclick = function handle1() {
        let value1 = Number(inp1.value);
       
        rslt1.textContent =  `Miles to Km: ${value1 * 1.609}`;
        rslt2.textContent =  `Km to Miles: ${value1 / 1.609}`;
    }
</script>
</html>
