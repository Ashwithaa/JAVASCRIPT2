<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order List</title>
</head>
<body>
    <select id="select1" >
        <option disabled selected>Select Unit</option>
        <option value="0">Dollar-Rs</option>
        <option value="1">Meter-Cm</option>
        <option value="2">Inch-Feet</option>
        <option value="3">Km-Mile</option>
        <option value="4">Kg-Pound</option>
        <option value="5">Centigrade-Fahrenheit</option>
    </select>
    <input type="text" id="input1">
    <button id="button1">Submit</button>
    <p id="line1"></p>
    
    <script>
        const sel1 = document.getElementById("select1");
        const btn1 = document.getElementById("button1");
        const inp1 = document.getElementById("input1");
        const ln1  = document.getElementById("line1");

        const units = [
                ['Dollar', 'Rs', 1, 83],
                ['Meter', 'Cm', 1, 100],
                ['Inch', 'Feet', 1, 0.0833],
                ['Km', 'Mile', 1, 0.621],
                ['Kg', 'Pound', 1, 2.204],
                ['Centigrade', 'Fahrenheit', 1, '33.3']
            ];    

        btn1.onclick = function handle1(){
            const index = sel1.value;
            const value1 = Number(inp1.value);
            
            const [fromLabel, toLabel, fromRatio, toRatio] = units[index]; //This method is destructing array - unpacking array
            
            const result = (value1 / fromRatio) * toRatio; //Universal Formula
            line1.textContent = `${fromLabel}  ${fromRatio} = ${result} ${toLabel}`;

        }
       
    </script>
</body>
</html>
