<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ladder Length Calculator</title>
    <style>
        * {
            font-family: Arial;
            font-weight: bold;
        }
        button{
            font-size: 16px;
            margin-top: 10px; 
        }
    </style>
</head>
<body>
    <h1>Ladder Length Calculator</h1>
    <table>
        <tr>
            <td>Enter height to reach:</td>
            <td><input type="number" id="length1"></td>
        </tr>
        <tr>
            <td>Enter Wall-to-Ladder Distance:</td>
            <td><input type="number" id="length2"></td>
        </tr>
    </table>
   <button id="submit1">Submit</button><br>
   <p style="font-weight:700;" id="result1"></p>
</body>
<script>
    const leng1 = document.getElementById("length1");
    const leng2 = document.getElementById("length2");
    const sbmt1 = document.getElementById("submit1");
    const rslt1 = document.getElementById("result1");

    sbmt1.onclick = function handle1() {
        const length1 = Number(leng1.value);
        const length2 = Number(leng2.value);
        const length3 = Math.sqrt(length1**2 + length2**2);
        rslt1.textContent = "Ladder Length: " + length3.toString();
    };
</script>
</html>
